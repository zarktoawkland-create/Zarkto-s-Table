display_errors = Off
display_startup_errors = Off
log_errors = On
expose_php = Off

memory_limit = 192M
max_execution_time = 60
max_input_time = 60
post_max_size = 18M
upload_max_filesize = 8M

default_charset = "UTF-8"
date.timezone = "Asia/Shanghai"

opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
